# ci-pr-main: pre-promotion CI for the staging → main batch promotion
# (currently dormant per the staging-only bootstrap policy in CLAUDE.md;
# wakes up automatically when the policy lifts and a staging → main PR
# is opened).
#
# Validates the full release with k6 smoke + e2e matrix BEFORE anything
# lands on main. webkit project removed from matrix to match the current
# playwright.config.ts (only chromium + mobile-chrome declared).

name: ci-pr-main

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.32.0'

jobs:
  e2e-full:
    name: Browser tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-chrome]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familyhub_test
          POSTGRES_USER: fh_test
          POSTGRES_PASSWORD: fh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      FH_API_DIR: ${{ github.workspace }}/.ci-api
      DATABASE_URL: postgres://fh_test:fh_test@localhost:5432/familyhub_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # FHS-688: the browser tests boot the server from family-hub-api.
      - uses: actions/checkout@v7
        with:
          repository: familyhubapp971/family-hub-api
          ref: main
          path: .ci-api
      - run: pnpm --dir .ci-api install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          case "$BROWSER" in
            mobile-chrome) pnpm -F @familyhub/e2e exec playwright install --with-deps chromium ;;
            *) pnpm -F @familyhub/e2e exec playwright install --with-deps "$BROWSER" ;;
          esac
      # FHS-685: same three steps as ci-staging.yml; without them this job
      # found 0 tests and ran against an empty database.
      - name: Apply DB migrations for the e2e api
        run: pnpm --dir .ci-api exec drizzle-kit migrate
      - name: Generate BDD specs from .feature files
        run: pnpm -F @familyhub/e2e exec bddgen test --config playwright.config.ts
      - name: Assert bddgen produced specs
        run: pnpm -F @familyhub/e2e run _assert-bddgen
      - name: Run e2e (project=${{ matrix.browser }})
        env:
          PROJECT: ${{ matrix.browser }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm -F @familyhub/e2e exec playwright test --config playwright.config.ts --project "$PROJECT"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-main-${{ matrix.browser }}
          path: tests/e2e/playwright-report/
